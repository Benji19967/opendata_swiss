[project]
name = "opendata-swiss"
version = "0.1.0"
description = "Exploring Opendata Swiss"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "" }
]

dependencies = [
    "ckanapi>=4.11",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

# Dev dependencies
[dependency-groups]
dev = []
